<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/goit-advancedjs-hw-03/assets/favicon-DcBtz0py.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search Pixabay photos and explore them in a full-size gallery."
    />
    <title>Image search</title>
    <script type="module" crossorigin src="/goit-advancedjs-hw-03/assets/index-DRvUI4pO.js"></script>
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-03/assets/index-CLfhucFr.css">
  </head>
  <body>
    <main class="container">
      <h1 class="visually-hidden">Image search</h1>
      <form class="form">
        <label>
          <span class="visually-hidden">Search images</span>
          <input
            type="text"
            name="search-text"
            placeholder="Search images..."
            maxlength="100"
            required
          />
        </label>
        <button type="submit">Search</button>
      </form>
      <p class="attribution">
        Photos by
        <a href="https://pixabay.com/" target="_blank" rel="noopener noreferrer"
          >Pixabay</a
        >
      </p>
      <div class="loader" role="status">
        <span class="visually-hidden">Loading images, please wait...</span>
      </div>
      <ul
        class="gallery"
        aria-label="Image search results"
        aria-busy="false"
      ></ul>
    </main>
  </body>
</html>
